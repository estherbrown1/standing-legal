<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standing — You're invited</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #fff;
    color: #1a1a1a;
    padding: 24px 20px;
    max-width: 480px;
    margin: 0 auto;
  }
  .wordmark {
    font-family: Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 24px;
  }
  .wordmark span { color: #E85D04; }
  h1 {
    font-family: Georgia, serif;
    font-size: 32px;
    line-height: 1.2;
    margin-bottom: 12px;
  }
  .sub { color: #666; font-size: 16px; margin-bottom: 24px; line-height: 1.5; }
  .card {
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .venue { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .when { font-size: 16px; margin-bottom: 4px; }
  .who { color: #666; font-size: 14px; }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #333;
  }
  input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .btn {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .btn-in { background: #E85D04; color: #fff; }
  .btn-out {
    background: #fff;
    color: #1a1a1a;
    border: 1px solid #ddd;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: #d32f2f; font-size: 14px; margin-bottom: 12px; }
  .success {
    text-align: center;
    padding: 40px 20px;
  }
  .success h2 {
    font-family: Georgia, serif;
    font-size: 28px;
    margin-bottom: 12px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wordmark">Stand<span>ing</span></div>

<div id="loading">
  <p class="sub">Loading your invite…</p>
</div>

<div id="invite" class="hidden">
  <h1 id="headline">You're invited</h1>
  <p class="sub" id="inviter"></p>
  
  <div class="card">
    <div class="venue" id="venue"></div>
    <div class="when" id="when"></div>
    <div class="who" id="who"></div>
  </div>

  <label for="phone">Your phone number</label>
  <input
    type="tel"
    id="phone"
    placeholder="(555) 123-4567"
    autocomplete="tel"
  >
  <div class="error hidden" id="phoneError"></div>

  <button class="btn btn-in" id="btnIn">I'm in ✓</button>
  <button class="btn btn-out" id="btnOut">Can't make it</button>
  
  <p class="sub" style="margin-top: 16px; font-size: 14px;">
    No app needed. We'll text you a reminder the day before.
  </p>
</div>

<div id="done" class="hidden success">
  <h2 id="doneTitle"></h2>
  <p class="sub" id="doneSub"></p>
</div>

<div id="error" class="hidden">
  <h1>Link not found</h1>
  <p class="sub">This invite link doesn't look right. Ask your host to send it again.</p>
</div>

<script>
  const SUPABASE_URL = 'https://yoeowmvyvjcerqlayxzb.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvZW93bXZ5dmpjZXJxbGF5eHpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2Njk2MTUsImV4cCI6MjEwNzI0NTYxNX0.xzjV6CahsZ6xUuimZgT0UOyUM2Rx0zlNa5uzr6MGfqw';
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t');
  
  async function init() {
    if (!token) {
      show('error');
      return;
    }
    try {
      const { data, error } = await supabase.rpc('guest_get_plan', { p_token: token });
      if (error || !data) throw new Error('not found');
      
      const plan = Array.isArray(data) ? data[0] : data;
      document.getElementById('headline').textContent = 
        `${plan.host_name || 'Someone'} invited you to dinner`;
      document.getElementById('inviter').textContent = 
        `${plan.host_name || 'Your host'} started a Standing with you — dinner on repeat, no planning needed.`;
      document.getElementById('venue').textContent = plan.venue_name || 'TBD';
      document.getElementById('when').textContent = 
        `${plan.plan_date ? new Date(plan.plan_date).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) : ''} · ${plan.plan_time || ''}`;
      document.getElementById('who').textContent = 
        `${plan.party_size || ''} people · ${plan.venue_neighborhood || ''}`;
      
      show('invite');
    } catch (e) {
      show('error');
    }
  }
  
  function show(id) {
    ['loading', 'invite', 'done', 'error'].forEach(el => 
      document.getElementById(el).classList.add('hidden')
    );
    document.getElementById(id).classList.remove('hidden');
  }
  
  function getPhone() {
    const phone = document.getElementById('phone').value.replace(/\D/g, '');
    if (phone.length < 10) {
      document.getElementById('phoneError').textContent = 'Enter a valid phone number';
      document.getElementById('phoneError').classList.remove('hidden');
      return null;
    }
    document.getElementById('phoneError').classList.add('hidden');
    return phone;
  }
  
  async function rsvp(reply) {
    const phone = getPhone();
    if (!phone) return;
    
    document.getElementById('btnIn').disabled = true;
    document.getElementById('btnOut').disabled = true;
    
    try {
      const { error } = await supabase.rpc('guest_rsvp', {
        p_token: token,
        p_phone: phone,
        p_reply: reply,
      });
      if (error) throw error;
      
      document.getElementById('doneTitle').textContent = 
        reply === 'in' ? "You're in! 🎉" : "No worries";
      document.getElementById('doneSub').textContent = 
        reply === 'in' 
          ? "We'll text you the details and a reminder the day before."
          : "Thanks for letting us know. Maybe next time!";
      show('done');
    } catch (e) {
      document.getElementById('phoneError').textContent = 'Something went wrong. Try again.';
      document.getElementById('phoneError').classList.remove('hidden');
      document.getElementById('btnIn').disabled = false;
      document.getElementById('btnOut').disabled = false;
    }
  }
  
  document.getElementById('btnIn').onclick = () => rsvp('in');
  document.getElementById('btnOut').onclick = () => rsvp('out');
